      - name: Fetch AA bulk
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          python3 << 'PY'
          import json, os, sys, urllib.request, urllib.error

          KEY = os.environ.get("AA_API_KEY", "")
          if not KEY:
              print("::error::AA_API_KEY secret is empty")
              sys.exit(1)
          PRO  = "https://artificialanalysis.ai/api/v2/language/models"
          FREE = "https://artificialanalysis.ai/api/v2/language/models/free"
          OUT  = "top10-aa/aa_models.json"
          UA   = "Mozilla/5.0 (X11; Linux x86_64) top10-aa-bot"

          def get(url):
              req = urllib.request.Request(url, headers={
                  "x-api-key": KEY,
                  "Accept": "application/json",
                  "User-Agent": UA,
              })
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read())

          def fetch_all(base):
              out, page, tier, ver = [], 1, None, None
              while True:
                  j = get(f"{base}?page={page}")
                  out.extend(j.get("data") or [])
                  tier = j.get("tier", tier)
                  ver = j.get("intelligence_index_version", ver)
                  if not (j.get("pagination") or {}).get("has_more") or page >= 20:
                      break
                  page += 1
              return out, tier, ver

          try:
              models, tier, ver = fetch_all(PRO)
          except urllib.error.HTTPError as e:
              if e.code != 403:
                  raise
              models, tier, ver = fetch_all(FREE)

          if len(models) < 100:
              print(f"::warning::AA returned only {len(models)} models, keeping existing file")
              sys.exit(0)

          with open(OUT, "w") as f:
              json.dump(models, f)
          print(f"wrote {len(models)} models (tier={tier}, intelligence_index_version={ver})")
          PY
