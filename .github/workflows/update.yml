name: Update AA data every 6 hrs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AA bulk
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          curl -s \
            -H "X-API-Key: $AA_API_KEY" \
            "https://artificialanalysis.ai/api/v2/data/llms/models" \
            -o top10-aa/aa_models.json

      - name: Fetch OR models
        run: |
          curl -s "https://openrouter.ai/api/v1/models" -o top10-aa/or_models.json

      - name: Fetch OpenCode models
        run: |
          curl -s "https://opencode.ai/zen/v1/models" -o top10-aa/opencode_models.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top10-aa/aa_models.json top10-aa/or_models.json top10-aa/opencode_models.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update model data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No changes"
          fi
